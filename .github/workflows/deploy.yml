name: Deploy Marp Presentations

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install Marp
        run: npm install -g @marp-team/marp-cli

      - name: Build presentations and generate hub
        run: |
          python3 <<'PY'
          import html
          import re
          import shutil
          import subprocess
          import unicodedata
          from pathlib import Path

          def slugify(value):
              ascii_value = (
                  unicodedata.normalize("NFKD", value)
                  .encode("ascii", "ignore")
                  .decode("ascii")
                  .lower()
              )
              slug = re.sub(r"[^a-z0-9]+", "-", ascii_value).strip("-")
              if not slug:
                  raise ValueError(f"Cannot create URL slug from {value!r}")
              return slug

          markdown_files = sorted(Path("Presentation").glob("*/*.md"))
          if not markdown_files:
              raise RuntimeError("No presentation Markdown files found.")

          output_root = Path("presentations")
          cards = []
          used_slugs = set()

          for markdown_file in markdown_files:
              slug = slugify(markdown_file.stem)
              if slug in used_slugs:
                  raise ValueError(f"Duplicate presentation URL slug: {slug}")
              used_slugs.add(slug)

              output_dir = output_root / slug
              output_dir.mkdir(parents=True, exist_ok=True)

              temporary_markdown = output_dir / "marp-input.md"
              temporary_html = output_dir / "marp-input.html"
              try:
                  shutil.copyfile(markdown_file, temporary_markdown)
                  subprocess.run(
                      ["marp", "--html", temporary_markdown.name],
                      cwd=output_dir,
                      check=True,
                  )
                  if not temporary_html.is_file():
                      raise FileNotFoundError(
                          f"Marp did not create {temporary_html}"
                      )
                  temporary_html.replace(output_dir / "index.html")
              finally:
                  temporary_markdown.unlink(missing_ok=True)
                  temporary_html.unlink(missing_ok=True)

              name = re.sub(r"[-_]+", " ", markdown_file.stem).strip().title()
              safe_name = html.escape(name)
              link = f"{output_root.as_posix()}/{slug}/"
              cards.append(f"""
              <div class="card">
                  <h2>{safe_name}</h2>
                  <a href="{link}">View Presentation →</a>
              </div>
              """)

          index = Path("index.html")
          document = index.read_text(encoding="utf-8")
          start = "<!-- PRESENTATIONS -->"
          end = "<!-- END PRESENTATIONS -->"
          if start not in document or end not in document:
              raise ValueError("Missing presentation markers in index.html")

          before, remainder = document.split(start, 1)
          _, after = remainder.split(end, 1)
          generated = "\n".join(cards)
          index.write_text(
              before + start + generated + end + after,
              encoding="utf-8",
          )

          print(f"Generated {len(cards)} presentation cards.")
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4